apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq, role: broker } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          resources: { requests: { memory: 512Mi }, limits: { memory: 1Gi } }
          ports: [{ name: amqp, containerPort: 5672 }, { name: management, containerPort: 15672 }]
          volumeMounts:
            - { name: rabbitmq-data, mountPath: /var/lib/rabbitmq }
          env:
            - { name: RABBITMQ_DEFAULT_USER, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: RABBITMQ_USER } } }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: RABBITMQ_PASSWORD } } }
          startupProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim: { claimName: rabbitmq-data }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec: { selector: { app: rabbitmq }, ports: [{ name: amqp, port: 5672, targetPort: amqp }, { name: management, port: 15672, targetPort: 15672 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres, role: store } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          resources: { requests: { memory: 512Mi }, limits: { memory: 1Gi } }
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_DB, value: postgres }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: POSTGRES_ADMIN_PASSWORD } } }
          readinessProbe: { exec: { command: [pg_isready, -U, postgres, -d, postgres] }, initialDelaySeconds: 5 }
          livenessProbe: { exec: { command: [pg_isready, -U, postgres, -d, postgres] }, periodSeconds: 10 }
  volumeClaimTemplates:
    - metadata: { name: postgres-data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ name: postgres, port: 5432, targetPort: postgres }] }
---
