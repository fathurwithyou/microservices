apiVersion: apps/v1
kind: Deployment
metadata: { name: aggregator }
spec:
  replicas: 1
  selector: { matchLabels: { app: aggregator } }
  template:
    metadata: { labels: { app: aggregator } }
    spec:
      serviceAccountName: aggregator
      initContainers:
        - name: postgres-bootstrap
          image: postgres:17-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |-
              set -eu
              until pg_isready -h postgres -p 5432 -U aggregator -d aggregator_db; do sleep 2; done
              PGPASSWORD="$POSTGRES_PASSWORD" psql \
                --host=postgres \
                --port=5432 \
                --username=aggregator \
                --dbname=aggregator_db \
                --set=ON_ERROR_STOP=1 \
                --set=auth_password="$AUTH_DB_PASSWORD" \
                --file=/bootstrap/bootstrap.sql
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: bnpb-secrets, key: AGGREGATOR_DB_PASSWORD }
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: bnpb-secrets, key: AUTH_DB_PASSWORD }
          volumeMounts:
            - { name: postgres-bootstrap, mountPath: /bootstrap, readOnly: true }
        - name: migrate
          image: bnpb-m1/aggregator:local
          args: ["migrate", "up"]
          env:
            - { name: STORE_DRIVER, value: postgres }
            - { name: AGGREGATOR_DATABASE_URL, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AGGREGATOR_DATABASE_URL } } }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
        - name: seed
          image: bnpb-m1/aggregator:local
          args: ["seed"]
          env:
            - { name: STORE_DRIVER, value: postgres }
            - { name: AGGREGATOR_DATABASE_URL, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AGGREGATOR_DATABASE_URL } } }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
      containers:
        - name: aggregator
          image: bnpb-m1/aggregator:local
          ports: [{ name: grpc, containerPort: 9090 }, { name: http, containerPort: 8090 }]
          envFrom: [{ configMapRef: { name: bnpb-config } }]
          env:
            - { name: AGGREGATOR_GRPC_PORT, value: "9090" }
            - { name: AGGREGATOR_HTTP_PORT, value: "8090" }
            - { name: INTERNAL_SERVICE_TOKEN, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: INTERNAL_SERVICE_TOKEN } } }
            - { name: BMKG_API_KEY, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: BMKG_API_KEY } } }
            - { name: PVMBG_TOKEN, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: PVMBG_TOKEN } } }
            - { name: AGGREGATOR_DATABASE_URL, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AGGREGATOR_DATABASE_URL } } }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: RABBITMQ_URL } } }
            - { name: STORE_DRIVER, value: postgres }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
      volumes:
        - name: postgres-bootstrap
          configMap: { name: postgres-bootstrap }
---
apiVersion: v1
kind: Service
metadata: { name: aggregator }
spec: { selector: { app: aggregator }, ports: [{ name: grpc, port: 9090, targetPort: grpc }, { name: http, port: 8090, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth } }
  template:
    metadata: { labels: { app: auth } }
    spec:
      serviceAccountName: auth
      containers:
        - name: auth
          image: bnpb-m1/auth:local
          ports: [{ name: grpc, containerPort: 9091 }]
          envFrom: [{ configMapRef: { name: bnpb-config } }]
          env:
            - { name: AUTH_GRPC_PORT, value: "9091" }
            - { name: AUTH_DATABASE_URL, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: AUTH_DATABASE_URL } } }
            - { name: INTERNAL_SERVICE_TOKEN, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: INTERNAL_SERVICE_TOKEN } } }
            - { name: MEDIA_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: MEDIA_CLIENT_SECRET } } }
            - { name: FIELD_TEAM_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: FIELD_TEAM_CLIENT_SECRET } } }
            - { name: BNPB_OPS_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: BNPB_OPS_CLIENT_SECRET } } }
          readinessProbe: { tcpSocket: { port: grpc }, initialDelaySeconds: 2 }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
---
