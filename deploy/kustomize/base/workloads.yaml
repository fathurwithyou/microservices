apiVersion: apps/v1
kind: Deployment
metadata: { name: bmkg }
spec:
  replicas: 1
  selector: { matchLabels: { app: bmkg } }
  template:
    metadata: { labels: { app: bmkg } }
    spec:
      serviceAccountName: bmkg
      containers:
        - name: bmkg
          image: bnpb-m1/bmkg:local
          ports: [{ name: http, containerPort: 8081 }]
          envFrom: [{ configMapRef: { name: bnpb-config } }]
          env:
            - { name: BMKG_PORT, value: "8081" }
            - { name: BMKG_API_KEY, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: BMKG_API_KEY } } }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
---
apiVersion: v1
kind: Service
metadata: { name: bmkg }
spec: { selector: { app: bmkg }, ports: [{ name: http, port: 8081, targetPort: http }] }
---
