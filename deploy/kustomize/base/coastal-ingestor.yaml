apiVersion: apps/v1
kind: Deployment
metadata:
  name: coastal-ingestor
  labels: { app: coastal-ingestor, role: sensor }
spec:
  replicas: 2
  selector: { matchLabels: { app: coastal-ingestor } }
  template:
    metadata:
      labels: { app: coastal-ingestor, role: sensor }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: coastal-ingestor
          image: bnpb-m1/coastal-ingestor:local
          ports: [{ name: health, containerPort: 8087 }]
          envFrom: [{ configMapRef: { name: bnpb-config } }]
          env:
            - { name: COASTAL_INGESTOR_HEALTH_PORT, value: "8087" }
            - { name: SENSOR_URL, value: http://sensor-pantai:8080 }
            - { name: SENSOR_TOKEN, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: SENSOR_TOKEN } } }
            - { name: COASTAL_INGESTOR_POLL_INTERVAL, value: "1s" }
            - { name: INTERNAL_SERVICE_TOKEN, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: INTERNAL_SERVICE_TOKEN } } }
            - { name: COASTAL_DATABASE_URL, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: COASTAL_DATABASE_URL } } }
          readinessProbe: { httpGet: { path: /health, port: health }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /health, port: health }, periodSeconds: 10 }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
---
apiVersion: v1
kind: Service
metadata:
  name: coastal-ingestor
  labels: { app: coastal-ingestor }
spec:
  selector: { app: coastal-ingestor }
  ports: [{ name: health, port: 8087, targetPort: health }]
