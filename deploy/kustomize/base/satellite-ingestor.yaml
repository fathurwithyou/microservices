apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-ingestor
  labels: { app: satellite-ingestor, role: sensor }
spec:
  replicas: 2
  selector: { matchLabels: { app: satellite-ingestor } }
  template:
    metadata:
      labels: { app: satellite-ingestor, role: sensor }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 10001 }
      containers:
        - name: satellite-ingestor
          image: bnpb-m1/satellite-ingestor:local
          ports: [{ name: health, containerPort: 8086 }]
          envFrom: [{ configMapRef: { name: bnpb-config } }]
          env:
            - { name: SATELIT_INGESTOR_HEALTH_PORT, value: "8086" }
            - { name: FEED_URL, value: "https://satellite.naufarrel.dev" }
            - { name: FEED_TOKEN, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: FEED_TOKEN } } }
            - { name: INTERNAL_SERVICE_TOKEN, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: INTERNAL_SERVICE_TOKEN } } }
            - { name: SATELLITE_DATABASE_URL, value: "postgresql://satellite@cockroachdb-public:26257/satellite_db?sslmode=verify-full&sslrootcert=/cockroach/certs/ca.crt&sslcert=/cockroach/certs/client.satellite.crt&sslkey=/cockroach/certs/client.satellite.key" }
          readinessProbe: { httpGet: { path: /health, port: health }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /health, port: health }, periodSeconds: 10 }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
          volumeMounts:
            - { name: cockroach-client-certs, mountPath: /cockroach/certs, readOnly: true }
      volumes:
        # Only this service's own SQL identity.
        - name: cockroach-client-certs
          secret:
            secretName: cockroach-client-satellite
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: satellite-ingestor
  labels: { app: satellite-ingestor }
spec:
  selector: { app: satellite-ingestor }
  ports: [{ name: health, port: 8086, targetPort: health }]
