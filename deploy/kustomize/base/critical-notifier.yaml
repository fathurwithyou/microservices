apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-notifier
  labels: { app: consumer, consumer: critical, role: consumer }
spec:
  replicas: 1
  selector: { matchLabels: { app: consumer, consumer: critical } }
  template:
    metadata:
      labels: { app: consumer, consumer: critical, role: consumer }
    spec:
      serviceAccountName: consumer
      containers:
        - name: critical-notifier
          image: bnpb-m1/notifier-consumer:local
          ports: [{ name: health, containerPort: 8093 }]
          envFrom: [{ configMapRef: { name: bnpb-config } }]
          env:
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: RABBITMQ_URL } } }
            - { name: NOTIFIER_QUEUE, value: notifier.critical }
            - { name: NOTIFIER_SERVICE_NAME, value: critical-notifier }
            - { name: NOTIFIER_EXCHANGE, value: hazard.events.critical }
            - { name: CONSUMER_HEALTH_PORT, value: "8093" }
          readinessProbe: { httpGet: { path: /health, port: health }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /health, port: health }, periodSeconds: 10 }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
