apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: client-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: client-api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cockroachdb
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: cockroachdb }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
