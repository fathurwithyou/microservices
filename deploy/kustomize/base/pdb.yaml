---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: critical-notifier
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: consumer, consumer: critical }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portal-consumer
