apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sistem-informasi-kebencanaan-bnpb
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - postgres-bootstrap.yaml
  - auth-db-bootstrap-job.yaml
  - persistentvolumeclaims.yaml
  - workloads.yaml
  - pod-services.yaml
  - pdb.yaml
  - cockroachdb-statefulset.yaml
  - cockroachdb-certs-job.yaml
  - cockroachdb-bootstrap-job.yaml
  - satellite-ingestor.yaml
  - satellite-feed.yaml
  - coastal-ingestor.yaml
  - sensor-pantai.yaml
  - critical-notifier.yaml
  - observability.yaml
  - demo.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: cockroachdb-bootstrap
    files: [bootstrap.sql=cockroach/bootstrap.sql]
    options: { disableNameSuffixHash: true }
