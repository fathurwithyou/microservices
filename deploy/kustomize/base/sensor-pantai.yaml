# Vendor sensor image, pinned by digest. Do not rebuild or retag it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-pantai
  labels: { app: sensor-pantai, role: sensor }
spec:
  replicas: 1
  selector: { matchLabels: { app: sensor-pantai } }
  template:
    metadata:
      labels: { app: sensor-pantai, role: sensor }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 65532 }
      containers:
        - name: sensor-pantai
          image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: PANTAI_ADDR, value: ":8080" }
            - { name: PANTAI_AUTH_TOKEN, valueFrom: { secretKeyRef: { name: bnpb-secrets, key: SENSOR_TOKEN } } }
            - { name: PANTAI_PROFILE, valueFrom: { configMapKeyRef: { name: bnpb-config, key: PANTAI_PROFILE } } }
            - { name: PANTAI_STATE_DIR, value: /data }
          # The exam profile needs the demo key (PANTAI_KEY_FILE). The Secret is
          # optional, so the practice profile runs without it. PANTAI_KEY_FILE is
          # deliberately NOT set here: how the vendor binary treats a key path
          # that does not exist under the practice profile is untested, so
          # `scripts/m2-demo.sh` (sensor_profile exam) adds
          # PANTAI_KEY_FILE=/var/run/pantai/key when it switches to exam and
          # removes it again for practice.
          volumeMounts:
            - { name: state, mountPath: /data }
            - { name: pantai-key, mountPath: /var/run/pantai, readOnly: true }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
      volumes:
        - name: state
          emptyDir: {}
        - name: pantai-key
          secret:
            secretName: sensor-pantai-key
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-pantai
  labels: { app: sensor-pantai, role: sensor }
spec:
  selector: { app: sensor-pantai }
  ports: [{ name: http, port: 8080, targetPort: http }]
