apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-owner-only }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: aggregator } } }
        - { podSelector: { matchLabels: { app: auth } } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: rabbitmq-consumers-and-aggregator }
spec:
  podSelector: { matchLabels: { app: rabbitmq } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: aggregator } } }
        - { podSelector: { matchLabels: { app: consumer } } }
      ports: [{ protocol: TCP, port: 5672 }]
    - from:
        - { podSelector: { matchLabels: { app: demo-api } } }
      ports: [{ protocol: TCP, port: 15672 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: cockroach-aggregator-only }
spec:
  podSelector: { matchLabels: { app: cockroachdb } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: aggregator } } }
        - { podSelector: { matchLabels: { app: satellite-ingestor } } }
        - { podSelector: { matchLabels: { app: coastal-ingestor } } }
      ports: [{ protocol: TCP, port: 26257 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sensor-pantai-consumer }
spec:
  podSelector: { matchLabels: { app: sensor-pantai } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: coastal-ingestor } } }
      ports: [{ protocol: TCP, port: 8080 }]
