apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-owner-only }
spec:
  # PostgreSQL holds auth_db only; the aggregator store is CockroachDB.
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: auth } } }
        - { podSelector: { matchLabels: { app: auth-db-bootstrap } } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: rabbitmq-consumers-and-aggregator }
spec:
  podSelector: { matchLabels: { app: rabbitmq } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: aggregator } } }
        - { podSelector: { matchLabels: { app: consumer } } }
      ports: [{ protocol: TCP, port: 5672 }]
    - from:
        - { podSelector: { matchLabels: { app: demo-api } } }
      ports: [{ protocol: TCP, port: 15672 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: cockroach-store-owners }
spec:
  # Only the three store owners (each limited to its own database by SQL
  # grants), the bootstrap Job, and the other CockroachDB nodes reach SQL.
  podSelector: { matchLabels: { app: cockroachdb } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: cockroachdb } } }
        - { podSelector: { matchLabels: { app: cockroachdb-bootstrap } } }
        - { podSelector: { matchLabels: { app: aggregator } } }
        - { podSelector: { matchLabels: { app: satellite-ingestor } } }
        - { podSelector: { matchLabels: { app: coastal-ingestor } } }
      ports: [{ protocol: TCP, port: 26257 }]
    # Admin UI and /_status/vars for Prometheus.
    - from:
        - { podSelector: { matchLabels: { app: prometheus } } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sensor-pantai-consumer }
spec:
  podSelector: { matchLabels: { app: sensor-pantai } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: coastal-ingestor } } }
      ports: [{ protocol: TCP, port: 8080 }]
