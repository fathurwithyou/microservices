# One-shot TLS bootstrap for CockroachDB.
#
# Produces, in the pod's namespace:
#   - cockroach-ca                 ca.crt, ca.key  (read only by this Job, so a
#                                  re-run can sign certs for a new SQL user)
#   - bnpb-secrets (merged keys)   ca.crt, node.crt, node.key, client.root.*
#                                  (cluster nodes and the bootstrap Job only)
#   - cockroach-client-<user>      ca.crt, client.<user>.crt, client.<user>.key
#                                  for aggregator, satellite, coastal. Each
#                                  workload mounts only its own Secret, so a
#                                  service can authenticate only as itself.
#
# Steps run in order: fetch-ca and generate are initContainers, publish runs
# last. Re-running is safe: existing node and client material is never
# replaced. Rotation is manual: delete the Secrets above and re-run the Job,
# then restart CockroachDB and the three store owners.
apiVersion: v1
kind: ServiceAccount
metadata: { name: cockroachdb-certs }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: cockroachdb-certs }
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: cockroachdb-certs }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cockroachdb-certs }
subjects:
  - { kind: ServiceAccount, name: cockroachdb-certs }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cockroachdb-certs
  labels: { app: cockroachdb-certs, role: other }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: cockroachdb-certs, role: other }
    spec:
      serviceAccountName: cockroachdb-certs
      restartPolicy: OnFailure
      initContainers:
        # Reuse the existing CA so certs for new users verify against the
        # cluster. A cluster that already has node certs but no stored CA key
        # cannot get new client certs; fail loudly instead of minting a CA the
        # nodes would reject.
        - name: fetch-ca
          image: alpine/k8s:1.31.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if kubectl -n "$POD_NAMESPACE" get secret cockroach-ca >/dev/null 2>&1; then
                kubectl -n "$POD_NAMESPACE" get secret cockroach-ca -o jsonpath='{.data.ca\.crt}' | base64 -d > /certs/ca.crt
                kubectl -n "$POD_NAMESPACE" get secret cockroach-ca -o jsonpath='{.data.ca\.key}' | base64 -d > /certs/ca.key
                chmod 0600 /certs/ca.key
                echo "reusing CA from cockroach-ca"
              elif [ -n "$(kubectl -n "$POD_NAMESPACE" get secret bnpb-secrets -o jsonpath='{.data.node\.key}' 2>/dev/null)" ]; then
                echo "bnpb-secrets has node certs but cockroach-ca is missing; rotate certs (see header)" >&2
                exit 1
              fi
          env:
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          volumeMounts:
            - { name: certs, mountPath: /certs }
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 128Mi }
        - name: generate
          image: cockroachdb/cockroach:v25.4.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /certs/ca.key ]; then
                /cockroach/cockroach cert create-ca --certs-dir=/certs --ca-key=/certs/ca.key
              fi
              /cockroach/cockroach cert create-node \
                localhost 127.0.0.1 \
                cockroachdb "cockroachdb.${POD_NAMESPACE}" \
                "cockroachdb.${POD_NAMESPACE}.svc" \
                "cockroachdb.${POD_NAMESPACE}.svc.cluster.local" \
                cockroachdb-public "cockroachdb-public.${POD_NAMESPACE}" \
                "cockroachdb-public.${POD_NAMESPACE}.svc" \
                "cockroachdb-public.${POD_NAMESPACE}.svc.cluster.local" \
                cockroachdb-0.cockroachdb cockroachdb-1.cockroachdb cockroachdb-2.cockroachdb \
                "*.cockroachdb.${POD_NAMESPACE}.svc" \
                "*.cockroachdb.${POD_NAMESPACE}.svc.cluster.local" \
                --certs-dir=/certs --ca-key=/certs/ca.key
              for user in root $SQL_USERS; do
                /cockroach/cockroach cert create-client "$user" --certs-dir=/certs --ca-key=/certs/ca.key
              done
          env:
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: SQL_USERS, value: "aggregator satellite coastal" }
          volumeMounts:
            - { name: certs, mountPath: /certs }
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 128Mi }
      containers:
        - name: publish
          image: alpine/k8s:1.31.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ns="$POD_NAMESPACE"
              # merge_secret NAME FILE... : create NAME if absent, then merge
              # the given files as keys. Other keys in NAME are preserved.
              merge_secret() {
                name="$1"; shift
                kubectl -n "$ns" get secret "$name" >/dev/null 2>&1 || \
                  kubectl -n "$ns" create secret generic "$name"
                patch=$(mktemp)
                printf '{"data":{' > "$patch"
                sep=""
                for f in "$@"; do
                  printf '%s"%s":"%s"' "$sep" "$f" "$(base64 "/certs/$f" | tr -d '\n')" >> "$patch"
                  sep=","
                done
                printf '}}' >> "$patch"
                kubectl -n "$ns" patch secret "$name" --type merge --patch-file "$patch"
              }

              if ! kubectl -n "$ns" get secret cockroach-ca >/dev/null 2>&1; then
                merge_secret cockroach-ca ca.crt ca.key
              fi
              if [ -z "$(kubectl -n "$ns" get secret bnpb-secrets -o jsonpath='{.data.node\.key}' 2>/dev/null)" ]; then
                merge_secret bnpb-secrets ca.crt node.crt node.key client.root.crt client.root.key
              else
                echo "bnpb-secrets already holds node certs; leaving them untouched"
              fi
              for user in $SQL_USERS; do
                if kubectl -n "$ns" get secret "cockroach-client-$user" >/dev/null 2>&1; then
                  echo "cockroach-client-$user exists; leaving it untouched"
                  continue
                fi
                merge_secret "cockroach-client-$user" ca.crt "client.$user.crt" "client.$user.key"
              done
          env:
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: SQL_USERS, value: "aggregator satellite coastal" }
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: certs
          emptyDir: {}
