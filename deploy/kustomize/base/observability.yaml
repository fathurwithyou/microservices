# Demo-only observability stack: no storage, no auth hardening, single replica.
# Prometheus scrapes its own config plus the OTel Collector's Prometheus exporter.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: { app: prometheus }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8889"]
      - job_name: services
        static_configs:
          - targets:
              - "aggregator:8090"
              - "client-api:8080"
              - "auth:9092"
              - "bmkg:8081"
              - "pvmbg:8082"
              - "dashboard-consumer:8083"
              - "notifier-consumer:8084"
              - "portal-consumer:8085"
              - "critical-notifier:8093"
              - "satellite-ingestor:8086"
              - "coastal-ingestor:8087"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels: { app: otel-collector }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls: { insecure: true }
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        traces: { receivers: [otlp], exporters: [otlp/tempo] }
        metrics: { receivers: [otlp], exporters: [prometheus] }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels: { app: tempo }
data:
  tempo.yaml: |
    server: { http_listen_port: 3200 }
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: 0.0.0.0:4317 }
            http: { endpoint: 0.0.0.0:4318 }
    storage:
      trace:
        backend: local
        local: { path: /tmp/tempo/blocks }
        wal: { path: /tmp/tempo/wal }
    usage_report: { reporting_enabled: false }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels: { app: grafana }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, type: prometheus, uid: prometheus, url: "http://prometheus:9090", isDefault: true }
      - { name: Tempo, type: tempo, url: "http://tempo:3200" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app: prometheus, role: other }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus, role: other }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/tmp/prometheus
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /-/healthy, port: http }, periodSeconds: 15 }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app: prometheus }
spec: { selector: { app: prometheus }, ports: [{ name: http, port: 9090, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app: grafana, role: other }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata:
      labels: { app: grafana, role: other }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboard-json, mountPath: /var/lib/grafana/dashboards, readOnly: true }
          readinessProbe: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 30 }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards
            items: [{ key: provider.yaml, path: provider.yaml }]
        - name: dashboard-json
          configMap:
            name: grafana-dashboards
            items: [{ key: bnpb.json, path: bnpb.json }]
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: { app: grafana }
spec: { selector: { app: grafana }, ports: [{ name: http, port: 3000, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: { app: otel-collector, role: other }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata:
      labels: { app: otel-collector, role: other }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: prometheus, containerPort: 8889 }
          volumeMounts:
            - { name: config, mountPath: /etc/otel, readOnly: true }
          readinessProbe: { tcpSocket: { port: otlp-grpc }, initialDelaySeconds: 5 }
          livenessProbe: { tcpSocket: { port: otlp-grpc }, periodSeconds: 15 }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: { app: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: prometheus, port: 8889, targetPort: prometheus }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels: { app: tempo, role: other }
spec:
  replicas: 1
  selector: { matchLabels: { app: tempo } }
  template:
    metadata:
      labels: { app: tempo, role: other }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo, readOnly: true }
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 30 }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false }
      volumes:
        - name: config
          configMap: { name: tempo-config }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels: { app: tempo }
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels: { app: grafana }
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: bnpb
        folder: BNPB
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards
  bnpb.json: |
    {
      "uid": "bnpb-m2",
      "title": "BNPB M2",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "HTTP request rate by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (rate(http_requests_total[1m]))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "HTTP 5xx ratio",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "HTTP p95 latency by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Coastal readings accepted and critical",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(coastal_readings_accepted_total[5m]))",
              "legendFormat": "accepted"
            },
            {
              "refId": "B",
              "expr": "sum(rate(coastal_critical_readings_total[5m]))",
              "legendFormat": "critical"
            }
          ]
        },
        {
          "id": 5,
          "title": "Coastal quarantine by reason",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (reason) (rate(coastal_readings_quarantined_total[5m]))",
              "legendFormat": "{{reason}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Satellite drops and submissions",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (reason) (rate(satellite_detections_dropped_total[5m]))",
              "legendFormat": "drop {{reason}}"
            },
            {
              "refId": "B",
              "expr": "sum by (status) (rate(satellite_fires_submitted_total[5m]))",
              "legendFormat": "submit {{status}}"
            }
          ]
        }
      ]
    }
