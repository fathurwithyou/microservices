# Load-test and demo entry point from outside the cluster: every node
# forwards :30080 to a ready Client API pod (M2 P2.6).
apiVersion: v1
kind: Service
metadata: { name: client-api-nodeport, namespace: sistem-informasi-kebencanaan-bnpb, labels: { role: api } }
spec:
  type: NodePort
  selector: { app: client-api }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30080 }]
