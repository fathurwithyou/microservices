syntax = "proto3";

package bnpb.auth;

option go_package = "github.com/fathurwithyou/microservices/contracts/gen/go/auth;authpb";

service Auth {
  rpc IssueToken(IssueTokenRequest) returns (TokenPair);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenPair);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidatedToken);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message IssueTokenRequest { string client_id = 1; string client_secret = 2; }
message RefreshTokenRequest { string refresh_token = 1; }
message ValidateTokenRequest { string access_token = 1; }
message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  string expires_at = 3;
  string client_id = 4;
  repeated string scopes = 5;
}
message ValidatedToken {
  bool valid = 1;
  string client_id = 2;
  repeated string scopes = 3;
  string expires_at = 4;
  string error = 5;
}
message HealthCheckRequest {}
message HealthCheckResponse { string status = 1; }
